    <main class="todo-main">
    <section>
        <h2 id="todo-title">My To-Do List</h2>
        <p id="todo-message">Add something to the list!</p>

        <form id="todo-form">
            <label for="todo-input">New task:</label>

            <input
                type="text"
                id="todo-input"
                placeholder="Enter a task"
                maxlength="200"
                required
            >

            <button id="add-button" type="submit">
                Add Task
            </button>
        </form>

        <p id="todo-status" role="status"></p>

        <p id="todo-error" role="alert" hidden></p>

        <button id="refresh-button" type="button">
            Refresh Tasks
        </button>

        <ul id="todo-list"></ul>
    </section>
</main>

 

    <script src="script.js"></script>
